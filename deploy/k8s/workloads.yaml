---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: qagrid}
spec:
  selector: {app: registry}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: qagrid}
spec:
  replicas: 2
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
      - name: registry
        image: qagrid-registry:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: registry-db-secret, key: database-url}}
        readinessProbe:
          httpGet: {path: /health/ready, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health/live, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {memory: 64Mi, cpu: 25m}
          limits: {memory: 256Mi, cpu: 300m}
---
apiVersion: v1
kind: Service
metadata: {name: scheduler, namespace: qagrid}
spec:
  selector: {app: scheduler}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler, namespace: qagrid}
spec:
  replicas: 2
  selector: {matchLabels: {app: scheduler}}
  template:
    metadata: {labels: {app: scheduler}}
    spec:
      containers:
      - name: scheduler
        image: qagrid-scheduler:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: scheduler-db-secret, key: database-url}}
        - {name: REGISTRY_BASE_URL, value: "http://registry.qagrid.svc.cluster.local:8000"}
        readinessProbe:
          httpGet: {path: /health/ready, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health/live, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {memory: 64Mi, cpu: 25m}
          limits: {memory: 256Mi, cpu: 300m}
