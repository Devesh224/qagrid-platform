apiVersion: v1
kind: Service
metadata: {name: registry-db, namespace: qagrid}
spec:
  clusterIP: None
  selector: {app: registry-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: registry-db, namespace: qagrid}
spec:
  serviceName: registry-db
  replicas: 1
  selector: {matchLabels: {app: registry-db}}
  template:
    metadata: {labels: {app: registry-db}}
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: registry}
        - {name: POSTGRES_USER, value: registry}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: registry-db-secret, key: password}}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: schema, mountPath: /docker-entrypoint-initdb.d/01-schema.sql, subPath: 01-schema.sql}
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U registry -d registry"]}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {memory: 128Mi, cpu: 50m}
          limits: {memory: 512Mi, cpu: 500m}
      volumes:
      - name: schema
        configMap: {name: registry-schema}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
---
