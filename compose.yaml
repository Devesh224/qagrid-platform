services:
  registry-db:
    image: postgres:16
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${QAGRID_REGISTRY_DB_PASSWORD:?Set QAGRID_REGISTRY_DB_PASSWORD in the environment or root .env}
    ports: ["5433:5432"]
    volumes:
      - registry-data:/var/lib/postgresql/data
      - ./environment-registry/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      retries: 15
  scheduler-db:
    image: postgres:16
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${QAGRID_SCHEDULER_DB_PASSWORD:?Set QAGRID_SCHEDULER_DB_PASSWORD in the environment or root .env}
    ports: ["5434:5432"]
    volumes:
      - scheduler-data:/var/lib/postgresql/data
      - ./reservation-scheduler/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      retries: 15
  registry:
    build: ./environment-registry
    image: qagrid-registry:1.0
    environment:
      DATABASE_URL: postgresql+psycopg://registry:${QAGRID_REGISTRY_DB_PASSWORD:?Set QAGRID_REGISTRY_DB_PASSWORD in the environment or root .env}@registry-db:5432/registry
    ports: ["8001:8000"]
    depends_on:
      registry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=2)"]
      interval: 5s
      retries: 15
  scheduler:
    build: ./reservation-scheduler
    image: qagrid-scheduler:1.0
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:${QAGRID_SCHEDULER_DB_PASSWORD:?Set QAGRID_SCHEDULER_DB_PASSWORD in the environment or root .env}@scheduler-db:5432/scheduler
      REGISTRY_BASE_URL: http://registry:8000
    ports: ["8002:8000"]
    depends_on:
      scheduler-db:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=2)"]
      interval: 5s
      retries: 15
  frontend:
    build: ./frontend
    image: qagrid-frontend:1.0
    ports: ["3000:80"]
    depends_on:
      registry:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      retries: 15
volumes:
  registry-data:
  scheduler-data:
